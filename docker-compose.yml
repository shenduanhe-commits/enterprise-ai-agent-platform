services:

  postgres:

    image: postgres:16

    restart: always


    environment:

      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      POSTGRES_DB: ${POSTGRES_DB}


    ports:

      - "${POSTGRES_PORT}:5432"


    volumes:

      - postgres_data:/var/lib/postgresql/data


    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER}"
        ]

      interval: 10s

      timeout: 5s

      retries: 5


    networks:

      - eaap-network



  redis:

    image: redis:7


    restart: always


    ports:

      - "${REDIS_PORT}:6379"


    healthcheck:

      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 10s

      timeout: 5s

      retries: 5


    networks:

      - eaap-network



  qdrant:

    image: qdrant/qdrant


    restart: always


    ports:

      - "${QDRANT_PORT}:6333"


    volumes:

      - qdrant_data:/qdrant/storage


    healthcheck:

      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"
        ]

      interval: 10s

      timeout: 5s

      retries: 5


    networks:

      - eaap-network



volumes:


  postgres_data:


  qdrant_data:



networks:


  eaap-network:

    driver: bridge
